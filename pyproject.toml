[project]
name = "satsel"
version = "0.1.0"
description = "ML-driven SAT solver selection via PySAT oracle wrappers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-sat==1.9.dev15",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "requests>=2.31",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.2",
    "torch-geometric>=2.5",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.scripts]
satsel = "satsel.cli:main"
satsel-web = "satsel.web_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsel"]

[tool.pytest.ini_options]
markers = [
    "quick: fast tests that run in CI (fake solvers)",
    "slow: real solver tests, run nightly",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
